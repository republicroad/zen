name: fmt-fix
on:
  push:
    branches: [feat/execution-context]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: cargo fmt（fmt-fix bot）"
