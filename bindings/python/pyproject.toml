[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "zen-engine"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

description = "Open-Source Business Rules Engine"
readme = "README.md"
authors = [{ name = "GoRules Team", email = "hi@gorules.io" }]
# fork：license-file 元数据（Metadata 2.4/PEP 639）被阿里云 PyPI 后端拒绝，改 SPDX 经典字段
license = "MIT"

keywords = ["gorules",
    "zen-engine",
    "business rules engine",
    "rules engine",
    "rule engine",
    "bre",
    "rule",
    "rules",
    "engine",
    "decision",
    "decision table",
    "rust",
    "pyo3"
]

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest", "asyncio"]

[project.urls]
Homepage = "https://gorules.io"
Documentation = "https://docs.gorules.io/developers/sdks/python"
Repository = "https://github.com/gorules/zen"

[project.scripts]
zenengine = "reader.__main__:main"

[tool.maturin]
features = ["pyo3/extension-module"]
