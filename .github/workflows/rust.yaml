name: Rust

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    paths-ignore:
      - 'bindings/**'
      - 'examples/**'
      - '.github/workflows/python.yaml'
      - '.github/workflows/node.yaml'
  push:
    tags:
      - 'zen-engine-v*'

env:
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup update stable
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-test-${{ matrix.os }}
          sccache-bucket: ${{ secrets.SCCACHE_S3_BUCKET }}
          sccache-region: ${{ secrets.SCCACHE_AWS_REGION }}
          sccache-role-arn: ${{ secrets.SCCACHE_AWS_ROLE_ARN }}
      - run: cargo test --workspace --all-features --exclude zen-ffi --exclude zen-nodejs --exclude zen-python --locked
      - name: Test without arbitrary_precision
        run: cargo test --workspace --exclude zen-ffi --exclude zen-nodejs --exclude zen-python --locked

  fmt:
    name: Cargo FMT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup update stable
      - run: cargo fmt --all -- --check

  release:
    name: Cargo Release
    runs-on: ubuntu-latest
    environment: release
    if: "github.ref_type == 'tag'"
    needs:
      - test
      - fmt
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        run: rustup update stable

      # crates publish 已移除：fork 无私有 crates 源；Rust crate 仅服务 Rust 用户，
      # Node/Python 包已内嵌编译产物（verdict/zen-udf 经 npm/PyPI 消费，不受影响）
