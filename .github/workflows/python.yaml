name: Python
env:
  WORKING_DIRECTORY: bindings/python

on:
  pull_request:
    paths:
      - 'bindings/python/**'
      - 'core/**'
      - 'test-data/**'
      - '.github/workflows/python.yaml'
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

jobs:
  # The build jobs skip on release events for other components (release-please fires
  # one `release` event per component; only `python-v*` should build/publish here).
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64
            args: --release --out dist --find-interpreter --locked -m bindings/python/Cargo.toml --zig --compatibility manylinux_2_28
            manylinux: auto
          - os: ubuntu-latest
            platform: linux
            target: aarch64
            args: --release --out dist --find-interpreter --locked -m bindings/python/Cargo.toml --zig --compatibility manylinux_2_28
            manylinux: auto
          - os: windows-latest
            platform: windows
            target: x64
            architecture: x64
            args: --release --out dist --find-interpreter --locked -m bindings/python/Cargo.toml
          - os: macos-latest
            platform: macos
            target: x86_64
            args: --release --out dist --find-interpreter --locked -m bindings/python/Cargo.toml
          - os: macos-latest
            platform: macos
            target: aarch64
            args: --release --out dist --find-interpreter --locked -m bindings/python/Cargo.toml
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}

      - name: Remove LICENSE (maturin auto-emits License-File metadata that the Aliyun PyPI backend rejects)
        run: rm -f bindings/python/LICENSE

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Remove LICENSE (see wheels job)
        run: rm -f bindings/python/LICENSE

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    # Publishes only on the release-please GitHub Release for the python component.
    if: "github.ref_type == 'tag'"
    needs: [ wheels, sdist ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to private PyPI (Aliyun)
        # fork 发布：阿里云制品仓库私有源（republicroad/zen 专用）。
        # 凭证走环境变量（twine 原生读取）——凭证含特殊字符时严禁经 ${{ secrets }}
        # 明文替换进脚本（bash 语法注入，已实证：密码含括号致 syntax error）
        run: |
          pip install "twine==6.1.0"
          twine upload             --repository-url https://sealweave-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/pypi/repo-tvrur             dist/*
        env:
          TWINE_USERNAME: ${{ secrets.ZEN_PYPI_USER }}
          TWINE_PASSWORD: ${{ secrets.ZEN_PYPI_PASS }}
